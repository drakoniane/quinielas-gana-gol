<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUINIELAS GANA-GOL - MARTES 17</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial, sans-serif}
body{background:#0a0a2e;background-image:radial-gradient(circle at 20% 20%, #ff6a00 0%, transparent 40%), radial-gradient(circle at 80% 80%, #ff2200 0%, transparent 40%), linear-gradient(180deg,#000428,#004e92);min-height:100vh;padding:15px;color:white}
.header{text-align:center;padding:10px 0}
.header h1{font-size:42px;line-height:.9;font-weight:900;color:#FFD700;text-shadow:0 0 5px #ff6a00,0 0 15px #ff3300,0 0 25px #ff0000,3px 3px 0 #7a0000}
.header h1 span{color:#fff;text-shadow:0 0 10px #ff6a00,0 0 20px #ff3300}
.subtitle{margin:8px auto 15px;background:#ff6a00;color:white;font-weight:900;padding:8px;border-radius:20px;font-size:15px;box-shadow:0 0 20px #ff4400;border:2px solid #FFD700}
.ball-wrap{text-align:center;font-size:80px;filter:drop-shadow(0 0 20px #ff6a00) drop-shadow(0 0 30px #ff2200);margin:5px 0}
input{width:100%;padding:14px;border-radius:12px;border:none;font-size:16px;margin-bottom:10px;border:2px solid #ff6a00}
.match{background:white;color:#111;border-radius:15px;padding:12px;margin-bottom:10px;box-shadow:0 0 15px rgba(255,106,0,.6);border-left:6px solid #ff6a00}
.match-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:900;font-size:16px}
.flag{font-size:34px}
.vs{color:#ff6a00;font-weight:900}
.hora{font-size:12px;background:#111;color:#FFD700;padding:3px 8px;border-radius:20px}
.boxes{display:flex;gap:8px;margin-top:10px}
.box{flex:1;text-align:center}
.box label{font-size:11px;font-weight:900;color:#666;display:block}
.box input{text-align:center;border:2px solid #ddd;padding:10px;font-weight:900;font-size:18px;margin:0}
.box select{width:100%;padding:10px;border-radius:10px;border:2px solid #ff6a00;background:#111;color:#FFD700;font-weight:900;font-size:18px;text-align:center}
.btn{background:linear-gradient(180deg,#FFD700,#ff6a00);color:#000;font-weight:900;font-size:20px;padding:16px;border:none;border-radius:15px;width:100%;box-shadow:0 0 25px #ff4400;cursor:pointer}
.footer{text-align:center;margin-top:15px;font-size:28px;font-weight:900;color:#FFD700;text-shadow:0 0 10px #ff3300,0 0 20px #ff0000;line-height:1}
.footer small{display:block;color:white;font-size:12px;text-shadow:none;margin-top:5px}
.q-title{background:#FFD700;color:#000;text-align:center;font-weight:900;padding:10px;border-radius:12px;margin:15px 0 10px;font-size:18px;box-shadow:0 0 15px #ff6a00}
.q-selector{background:white;color:#111;padding:12px;border-radius:15px;margin-bottom:5px}
.q-selector label{font-weight:900;font-size:14px}
.q-selector select{width:100%;padding:12px;border-radius:10px;border:2px solid #ff6a00;background:#111;color:#FFD700;font-weight:900;font-size:18px;text-align:center;margin-top:5px}
.total-box{background:#111;color:#FFD700;text-align:center;padding:10px;border-radius:12px;font-weight:900;margin-bottom:10px;border:2px dashed #ff6a00}
</style>
</head>
<body>
<div class="header">
<h1>QUINIELAS<br><span>GANA-GOL</span></h1>
<div class="subtitle">🔥 MARTES 17 DE NOVIEMBRE - JORNADA ESPECIAL 🔥</div>
</div>

<div class="ball-wrap">🔥⚽🔥</div>

<input id="nombre" placeholder="Tu nombre">

<div class="q-selector">
<label>🎟️ ¿Cuántas quinielas quieres jugar?</label>
<select id="numQuinielas" onchange="render()">
<option value="1">1 Quiniela - $100</option>
<option value="2">2 Quinielas - $200</option>
<option value="3">3 Quinielas - $300</option>
<option value="4">4 Quinielas - $400</option>
<option value="5">5 Quinielas - $500</option>
</select>
</div>

<div id="total" class="total-box">Total a pagar: $100 pesitos</div>

<div id="quinielas"></div>

<button class="btn" onclick="enviar()">🔥 APARTAR MIS LUGARES POR WHATSAPP 🔥</button>

<div class="footer">🔥⚽ Quinielas<br>Gana-Gol 🔥<small>El que haga más puntos se lleva el bote • $100 por quiniela</small></div>

<script>
const partidos=[
{n:'Singapur vs Brasil',f1:'🇸🇬',e1:'Singapur',f2:'🇧🇷',e2:'Brasil',h:'04:00 AM'},
{n:'Gales vs Portugal',f1:'🏴󐁧󐁢󐁷󐁬󐁳󐁿',e1:'Gales',f2:'🇵🇹',e2:'Portugal',h:'13:45 PM'},
{n:'Dinamarca vs Noruega',f1:'🇩🇰',e1:'Dinamarca',f2:'🇳🇴',e2:'Noruega',h:'13:45 PM'},
{n:'Chile vs Colombia',f1:'🇨🇱',e1:'Chile',f2:'🇨🇴',e2:'Colombia',h:'11:00 AM'},
{n:'México vs Paraguay',f1:'🇲🇽',e1:'México',f2:'🇵🇾',e2:'Paraguay',h:'18:00 PM'}
];
function render(){
let n=parseInt(document.getElementById('numQuinielas').value);
document.getElementById('total').innerText=`Total a pagar: $${n*100} pesitos`;
let html='';
for(let q=1;q<=n;q++){
html+=`<div class="q-title">🎟️ QUINIELA #${q}</div>`;
partidos.forEach((p,i)=>{
html+=`<div class="match"><div class="match-top"><span class="flag">${p.f1}</span> ${p.e1} <span class="vs">VS</span> ${p.e2} <span class="flag">${p.f2}</span></div><div style="text-align:center;margin-top:5px"><span class="hora">${p.h}</span></div><div class="boxes"><div class="box"><label>LOCAL</label><input id="l${q}_${i}" placeholder="-"></div><div class="box"><label>VISITA</label><input id="v${q}_${i}" placeholder="-"></div><div class="box"><label>ELIGE</label><select id="r${q}_${i}"><option value="L">L - Local</option><option value="E">E - Empate</option><option value="V">V - Visita</option></select></div></div></div>`;
});
}
document.getElementById('quinielas').innerHTML=html;
}
render();
function enviar(){
let n=document.getElementById('nombre').value;
if(!n){alert('Pon tu nombre bro');return}
let num=parseInt(document.getElementById('numQuinielas').value);
let txt=`🔥 QUINIELAS GANA-GOL - MARTES 17 🔥%0A%0ANombre: ${n}%0ACantidad: ${num} quiniela(s) - Total: $${num*100}%0A%0A`;
for(let q=1;q<=num;q++){
txt+=`--- QUINIELA #${q} ---%0A`;
partidos.forEach((p,i)=>{
let l=document.getElementById(`l${q}_${i}`).value||'-';
let v=document.getElementById(`v${q}_${i}`).value||'-';
let r=document.getElementById(`r${q}_${i}`).value||'-';
txt+=`${p.n}: ${l}-${v} (${r})%0A`;
});
txt+=`%0A`;
}
txt+=`Ya pagué $${num*100}`;
window.open(`https://wa.me/5214420000000?text=${txt}`,'_blank');
}
</script>
</body>
</html>
